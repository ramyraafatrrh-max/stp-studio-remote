<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>STP Studio Console</title>
    <style>
        :root {
            --stp-green: #12AD2B; --stp-yellow: #FFCE00; --stp-red: #D21034; --stp-black: #000000;
        }
        body { background: var(--stp-black); margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        
        #remote-container {
            background: var(--stp-green); padding: 10px; width: 580px;
            border: 2px solid white; display: flex; flex-direction: column; gap: 5px;
        }
        .button-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        
        .btn {
            background: var(--stp-yellow); color: black; border: 2px solid black;
            padding: 12px; text-align: center; font-weight: bold; border-radius: 4px;
            cursor: pointer; text-transform: uppercase; font-size: 0.8rem;
        }
        .btn:hover { background: white; }
        
        .launch-btn {
            background: var(--stp-red); color: white; padding: 15px 30px;
            border: none; border-radius: 30px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <button class="launch-btn" id="pipButton">📺 START STUDIO REMOTE</button>

    <div id="remote-container">
        <div style="background:var(--stp-red); color:white; font-size:10px; padding:3px; text-align:center; font-weight:bold;">
            SÃO TOMÉ ANALYTICAL STUDIO - LIVE CONSOLE
        </div>
        <div class="button-row">
            <div class="btn" onclick="navigate('https://canva.link/5biowk6ov7jhqc6')">Scouting</div>
            <div class="btn" onclick="navigate('https://canva.link/hepw0ymjujivjyl')">Tactics</div>
            <div class="btn" onclick="navigate('https://canva.link/2rl7kvkh5i203k2')">Plan</div>
            <div class="btn" onclick="navigate('https://canva.link/gsa2fkby7usl8ol')">Invite</div>
        </div>
    </div>

    <script>
        // This function forces the MAIN window to change slides
        function navigate(url) {
            if (window.opener) {
                window.opener.location.href = url;
            } else {
                // Fallback if the connection is lost
                window.open(url, 'canva_window');
            }
        }

        const pipButton = document.getElementById('pipButton');
        const remote = document.getElementById('remote-container');

        pipButton.addEventListener('click', async () => {
            if ('documentPictureInPicture' in window) {
                const pipWindow = await window.documentPictureInPicture.requestWindow({
                    width: 600, height: 110,
                });
                
                // Essential: Tell the new window who its "opener" is so navigation works
                pipWindow.opener = window;
                pipWindow.document.body.append(remote);

                // Copy styles
                [...document.styleSheets].forEach((styleSheet) => {
                    try {
                        const style = document.createElement('style');
                        style.textContent = [...styleSheet.cssRules].map((rule) => rule.cssText).join('');
                        pipWindow.document.head.appendChild(style);
                    } catch (e) {}
                });
            }
        });
    </script>
</body>
</html>
