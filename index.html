<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>STP Mission Control</title>
    <style>
        :root { --stp-green: #12AD2B; --stp-yellow: #FFCE00; --stp-red: #D21034; }
        body { background: var(--stp-green); margin: 0; font-family: 'Arial Black', sans-serif; overflow: hidden; }
        #header { background: var(--stp-red); color: white; text-align: center; padding: 5px; font-size: 12px; }
        .button-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 15px; }
        .btn {
            background: var(--stp-yellow); color: black; border: 3px solid black;
            padding: 15px 5px; text-align: center; font-weight: bold; border-radius: 8px;
            cursor: pointer; text-transform: uppercase; font-size: 0.9rem; transition: 0.2s;
        }
        .btn:active { background: white; transform: translateY(3px); }
    </style>
</head>
<body>
    <div id="header">STP ANALYTICAL STUDIO - LIVE REMOTE</div>
    <div class="button-row">
        <div class="btn" onclick="nav('https://canva.link/5biowk6ov7jhqc6'')">Scouting</div>
        <div class="btn" onclick="nav('https://canva.link/hepw0ymjujivjyl'')">Tactics</div>
        <div class="btn" onclick="nav('https://canva.link/2rl7kvkh5i203k2'')">Game Plan</div>
        <div class="btn" onclick="nav('https://canva.link/gsa2fkby7usl8ol'')">Invite</div>
    </div>

    <script>
        function nav(url) {
            // This attempts to update the window that opened this one
            if (window.opener && !window.opener.closed) {
                window.opener.location.href = url;
            } else {
                // If the connection is lost, it opens in a new tab as a backup
                window.open(url, 'presentation');
            }
        }
    </script>
</body>
</html>
