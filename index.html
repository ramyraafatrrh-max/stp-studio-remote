<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>STP Mission Control</title>
    <style>
        :root {
            --stp-green: #12AD2B;
            --stp-yellow: #FFCE00;
            --stp-red: #D21034;
            --stp-black: #000000;
        }
        body {
            background-color: var(--stp-black);
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #remote-container {
            background: var(--stp-green);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 300px;
        }
        .btn {
            background: var(--stp-yellow);
            color: black;
            border: 2px solid black;
            padding: 15px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .launch-btn {
            background: var(--stp-red);
            color: white;
            padding: 20px;
            font-size: 1.2rem;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <button class="launch-btn" id="pipButton">🚀 LAUNCH FLOATING REMOTE</button>

    <div id="remote-container">
        <h2 style="color:var(--stp-red); margin:0; text-align:center;">STP STUDIO</h2>
        <a href="https://canva.link/5biowk6ov7jhqc6" target="_blank" class="btn">SCOUTING</a>
        <a href="https://canva.link/hepw0ymjujivjyl" target="_blank" class="btn">TACTICS</a>
        <a href="https://canva.link/2rl7kvkh5i203k2" target="_blank" class="btn">PLAN</a>
        <a href="https://canva.link/gsa2fkby7usl8ol" target="_blank" class="btn">INVITE</a>
    </div>

    <script>
        const pipButton = document.getElementById('pipButton');
        const remote = document.getElementById('remote-container');

        pipButton.addEventListener('click', async () => {
            if ('documentPictureInPicture' in window) {
                // Open a Document PiP window
                const pipWindow = await window.documentPictureInPicture.requestWindow({
                    width: 300,
                    height: 400,
                });

                // Move the buttons into the floating window
                pipWindow.document.body.append(remote);
                
                // Copy styles to the new window
                [...document.styleSheets].forEach((styleSheet) => {
                    try {
                        const cssRules = [...styleSheet.cssRules].map((rule) => rule.cssText).join('');
                        const style = document.createElement('style');
                        style.textContent = cssRules;
                        pipWindow.document.head.appendChild(style);
                    } catch (e) {
                        const link = document.createElement('link');
                        link.rel = 'stylesheet';
                        link.href = styleSheet.href;
                        pipWindow.document.head.appendChild(link);
                    }
                });
            } else {
                alert("Your browser doesn't support floating windows. Try the latest version of Chrome.");
            }
        });
    </script>
</body>
</html>
